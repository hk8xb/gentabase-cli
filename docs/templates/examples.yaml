gentabase-init:
  - id: basic-usage
    name: Basic usage
    code: gentabase init
    response: Finished gentabase init.
  - id: from-workdir
    name: Initialize from an existing directory
    code: gentabase init --workdir .
    response: Finished gentabase init.
gentabase-login:
  - id: basic-usage
    name: Basic usage
    code: gentabase login
    response: |
      You can generate an access token from https://gentabase.dev/dashboard/account/tokens
      Enter your access token: sbp_****************************************
      Finished gentabase login.
gentabase-link:
  - id: basic-usage
    name: Basic usage
    code: gentabase link --project-ref ********************
    response: |
      Enter your database password (or leave blank to skip): ********
      Finished gentabase link.
  - id: without-password
    name: Link without database password
    code: gentabase link --project-ref ******************** <<< ""
    response: |
      Enter your database password (or leave blank to skip):
      Finished gentabase link.
  - id: using-alternate-dns
    name: Link using DNS-over-HTTPS resolver
    code: gentabase link --project-ref ******************** --dns-resolver https
    response: |
      Enter your database password (or leave blank to skip):
      Finished gentabase link.
gentabase-start:
  - id: basic-usage
    name: Basic usage
    code: gentabase start
    response: |
      Creating custom roles gentabase/roles.sql...
      Applying migration 20220810154536_employee.sql...
      Seeding data gentabase/seed.sql...
      Started gentabase local development setup.
  - id: without-studio
    name: Start containers without studio and imgproxy
    code: gentabase start -x studio,imgproxy
    response: |
      Excluding container: gentabase/studio:20221214-4eecc99
      Excluding container: darthsim/imgproxy:v3.8.0
      Started gentabase local development setup.
  - id: ignore-health-check
    name: Ignore service health checks
    code: gentabase start --ignore-health-check
    response: |
      service not healthy: [gentabase_storage_cli]
      Started gentabase local development setup.
gentabase-stop:
  - id: basic-usage
    name: Basic usage
    code: gentabase stop
    response: |
      Stopped gentabase local development setup.
      Local data are backed up to docker volume.
  - id: clean-up
    name: Clean up local data after stopping
    code: gentabase stop --no-backup
    response: |
      Stopped gentabase local development setup.
