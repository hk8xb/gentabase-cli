project_name: gentabase

builds:
  - main: .
    binary: gentabase
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/hk8xb/gentabase-cli/internal/utils.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "gentabase_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "gentabase_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: hk8xb
    name: gentabase-cli
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
