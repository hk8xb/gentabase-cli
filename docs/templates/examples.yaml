gentabase-migration-list:
  - id: basic-usage
    name: Basic usage
    code: gentabase migration list
    response: |2
            LOCAL      │     REMOTE     │     TIME (UTC)
      ─────────────────┼────────────────┼──────────────────────
                       │ 20230103054303 │ 2023-01-03 05:43:03
                       │ 20230103093141 │ 2023-01-03 09:31:41
        20230222032233 │                │ 2023-02-22 03:22:33
  - id: with-db-url
    name: Connect to self-hosted database
    code: gentabase migration list --db-url 'postgres://postgres[:percent_encoded_password]@127.0.0.1[:port]/postgres'
    response: |2
            LOCAL      │     REMOTE     │     TIME (UTC)
      ─────────────────┼────────────────┼──────────────────────
        20230103054303 │ 20230103054303 │ 2023-01-03 05:43:03
        20230103093141 │ 20230103093141 │ 2023-01-03 09:31:41
gentabase-migration-new:
  - id: basic-usage
    name: Basic usage
    code: gentabase migration new schema_test
    response: |
      Created new migration at gentabase/migrations/20230306095710_schema_test.sql.
  - id: pipe-stdin
    name: With statements piped from stdin
    code: echo "create schema if not exists test;" | gentabase migration new schema_test
    response: |
      Created new migration at gentabase/migrations/20230306095710_schema_test.sql.
gentabase-migration-repair:
  - id: basic-usage
    name: Mark a migration as reverted
    code: gentabase migration repair 20230103054303 --status reverted
    response: |
      Repaired migration history: 20230103054303 => reverted
  - id: mark-applied
    name: Mark a migration as applied
    code: gentabase migration repair 20230222032233 --status applied
    response: |
      Repaired migration history: 20230222032233 => applied
gentabase-db-diff:
  - id: basic-usage
    name: Basic usage
    code: gentabase db diff -f my_table
    response: |
      Connecting to local database...
      Creating shadow database...
      Applying migration 20230425064254_remote_commit.sql...
      Diffing schemas: auth,extensions,public,storage
      Finished gentabase db diff on branch main.

      No schema changes found
  - id: linked-project
    name: Against linked project
    code: gentabase db diff -f my_table --linked
    response: |
      Connecting to local database...
      Creating shadow database...
      Diffing schemas: auth,extensions,public,storage
      Finished gentabase db diff on branch main.

      WARNING: The diff tool is not foolproof, so you may need to manually rearrange and modify the generated migration.
      Run gentabase db reset to verify that the new migration does not generate errors.
  - id: specific-schema
    name: For a specific schema
    code: gentabase db diff -f my_table --schema auth
    response: |
      Connecting to local database...
      Creating shadow database...
      Diffing schemas: auth
      Finished gentabase db diff on branch main.

      No schema changes found
gentabase-db-dump:
  - id: basic-usage
    name: Basic usage
    code: gentabase db dump -f gentabase/schema.sql
    response: |
      Dumping schemas from remote database...
      Dumped schema to gentabase/schema.sql.
  - id: role-only
    name: Role only
    code: gentabase db dump -f gentabase/roles.sql --role-only
    response: |
      Dumping roles from remote database...
      Dumped schema to gentabase/roles.sql.
  - id: data-only
    name: Data only
    code: gentabase db dump -f gentabase/seed.sql --data-only
    response: |
      Dumping data from remote database...
      Dumped schema to gentabase/seed.sql.
gentabase-db-lint:
  - id: basic-usage
    name: Basic usage
    code: gentabase db lint
    response: |
      Linting schema: public

      No schema errors found
  - id: schema-warnings
    name: Warnings for a specific schema
    code: gentabase db lint --level warning --schema storage
    response: |
      Linting schema: storage
      [
        {
          "function": "storage.search",
          "issues": [
            {
              "level": "warning",
              "message": "unused variable \"_bucketid\"",
              "sqlState": "00000"
            }
          ]
        }
      ]
gentabase-db-pull:
  - id: basic-usage
    name: Basic usage
    code: gentabase db pull
    response: |
      Connecting to remote database...
      Schema written to gentabase/migrations/20240414044403_remote_schema.sql
      Update remote migration history table? [Y/n]
      Repaired migration history: [20240414044403] => applied
      Finished gentabase db pull.
      The auth and storage schemas are excluded. Run gentabase db pull --schema auth,storage again to diff them.
  - id: local-studio
    name: Local studio
    code: gentabase db pull --local
    response: |
      Connecting to local database...
      Setting up initial schema....
      Creating custom roles gentabase/roles.sql...
      Applying migration 20240414044403_remote_schema.sql...
      No schema changes found
      The auth and storage schemas are excluded. Run gentabase db pull --schema auth,storage again to diff them.
      exit status 1
  - id: custom-schemas
    name: Custom schemas
    code: gentabase db pull --schema auth,storage
    response: |
      Connecting to remote database...
      Setting up initial schema....
      Creating custom roles gentabase/roles.sql...
      Applying migration 20240414044403_remote_schema.sql...
      No schema changes found
      Try rerunning the command with --debug to troubleshoot the error.
      exit status 1
gentabase-db-push:
  - id: basic-usage
    name: Basic usage
    code: gentabase db push
    response: |
      Linked project is up to date.
  - id: self-hosted
    name: Self hosted
    code: gentabase db push --db-url "postgres://user:pass@127.0.0.1:5432/postgres"
    response: |
      Pushing migration 20230410135622_create_employees_table.sql...
      Finished gentabase db push.
  - id: dry-run
    name: Dry run
    code: gentabase db push --dry-run
    response: |
      DRY RUN: migrations will *not* be pushed to the database.
      Would push migration 20230410135622_create_employees_table.sql...
      Would push migration 20230425064254_my_table.sql...
      Finished gentabase db push.
gentabase-db-reset:
  - id: basic-usage
    name: Basic usage
    code: gentabase db reset
    response: |
      Resetting database...
      Initializing schema...
      Applying migration 20220810154537_create_employees_table.sql...
      Seeding data gentabase/seed.sql...
      Finished gentabase db reset on branch main.
gentabase-db-schema-declarative-sync:
  - id: with-pg-delta
    name: Sync declarative schema with pg-delta
    code: |
      # After editing declarative schema files, generate a migration:
      gentabase db schema declarative sync --experimental
    response: |
      Creating shadow database...
      Applying declarative schemas via pg-delta...
      Applied 239 statements in 1 round(s).
      Enter a name for this migration (press Enter to keep 'declarative_sync'): add_updated_at
      Created new migration at gentabase/migrations/20260317194051_add_updated_at.sql
      Apply this migration to local database? [Y/n]
      Connecting to local database...
      Applying migration 20260317194051_add_updated_at.sql...
      Migration applied successfully.
  - id: generate-first
    name: Generate declarative schema from migrations
    code: |
      gentabase db schema declarative sync --experimental
    response: |
      No declarative schema found. Generate a new one ? [Y/n]
      Reset local database to match migrations first? (local data will be lost) [y/N] y
      Resetting database...
      ...
      Declarative schema written to gentabase/declarative
      Finished gentabase db schema declarative generate.
gentabase-test-db:
  - id: basic-usage
    name: Basic usage
    code: gentabase test db
    response: |
      /tmp/gentabase/tests/nested/order_test.pg .. ok
      /tmp/gentabase/tests/pet_test.sql .......... ok
      All tests successful.
      Files=2, Tests=2,  6 wallclock secs ( 0.03 usr  0.01 sys +  0.05 cusr  0.02 csys =  0.11 CPU)
      Result: PASS
# TODO: use actual cli response for sso commands
gentabase-sso-show:
  - id: basic-usage
    name: Show information
    code: |-
      gentabase sso show 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst
    response: |-
      Information about the identity provider in pretty output.
  - id: metadata-output
    name: Get raw SAML 2.0 Metadata XML
    code: |-
      gentabase sso show 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst \
        --metadata
    response: |-
      Raw SAML 2.0 XML assigned to this identity provider. This is the
      version used in the authentication project, and if using a SAML 2.0
      Metadata URL it may change depending on the caching information
      contained within the metadata.
gentabase-sso-update:
  - id: basic-usage
    name: Replace domains
    code: |-
      gentabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst \
        --domains new-company.com,new-company.net
    response: |-
      Information about the updated provider.
  - id: add-domains
    name: Add an additional domain
    code: |-
      gentabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst \
        --add-domains company.net
    response: |-
      Information about the updated provider.
  - id: remove-domains
    name: Remove a domain
    code: |-
      gentabase sso update 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst \
        --remove-domains company.org
    response: |-
      Information about the updated provider.
gentabase-sso-remove:
  - id: basic-usage
    name: Remove a provider
    code: |-
      gentabase sso remove 6df4d73f-bf21-405f-a084-b11adf19fea5 \
        --project-ref abcdefghijklmnopqrst
    response: |-
      Information about the removed identity provider. It's a good idea to
      save this in case you need it later on.
gentabase-sso-add:
  - id: basic-usage
    name: Add with Metadata URL
    code: |-
      gentabase sso add \
        --project-ref abcdefgijklmnopqrst \
        --type saml \
        --metadata-url 'https://...' \
        --domains company.com
    response: |-
      Information about the added identity provider. You can use
      company.com as the domain name on the frontend side to initiate a SSO
      request to the identity provider.
  - id: with-xml
    name: Add with Metadata File
    code: |-
      gentabase sso add \
        --project-ref abcdefgijklmnopqrst \
        --type saml \
        --metadata-file /path/to/metadata/file.xml \
        --domains company.com
    response: |-
      Information about the added identity provider. You can use
      company.com as the domain name on the frontend side to initiate a SSO
      request to the identity provider.
gentabase-sso-info:
  - id: basic-usage
    name: Show project information
    code: gentabase sso info --project-ref abcdefghijklmnopqrst
    response: Information about your project's SAML 2.0 configuration.
